[project]
name = "tileclass"
version = "0.1.0"
description = "Minimal, fast tile-grid viewer for browsing and classifying folders of small microscopy/image tiles."
requires-python = ">=3.11"
dependencies = [
    "cellpose[gui]",
    "ipykernel",
    "jupyter",
    "matplotlib",
    "numpy",
    "Pillow",
    "polars",
    "psfkit",
    "PyQt6",
    "jssl-denoise @ https://github.com/delnatan/jssl_denoise.git",
    "pyvistra @ git+https://github.com/delnatan/pyvistra.git",
    "psfkit @ git+https://github.com/delnatan/psfkit.git",
    "qtpy",
    "scipy",
    "tifffile",
    "torch",
    "torchvision",
    "vispy",
    "seaborn>=0.13.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
]

[project.scripts]
tiled_viewer = "tileclass.__main__:main"
yeastprep = "yeastprep.__main__:main"
yeastprep-batch = "yeastprep.core.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
